[project]
name = "ai-gateway"
version = "0.1.0"
description = "AI gateway: routes prompts to LLM providers, with pluggable cache and router"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.6",
    "google-genai>=3.3.0",
    "openai>=3.50.0",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
    "redis>=6.4.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[tool.ruff]
line-length = 110
extend-exclude = ["deprecated"]   # archived code, not run (see deprecated/README.md)

[tool.pytest.ini_options]
markers = ["integration: needs a real Redis at GATEWAY_REDIS_URL (default redis://localhost:6379/0)"]
addopts = "-m 'not integration'"
asyncio_mode = "auto"
testpaths = ["quick_tests"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "fakeredis>=2.32.0",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.17.5",
]
